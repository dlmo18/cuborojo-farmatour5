name: Deploy Farmatour5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Evita ejecuciones concurrentes que se pisen entre sí durante el deploy
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

jobs:
  # ==========================================================
  # BUILD JOBS
  # ==========================================================

  build-backend:
    name: Build Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Disable npm cache in this workflow because the runner sometimes fails to resolve
          # the lockfile path before the repository is fully checkouted or in monorepo cases.

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Lint backend (non-blocking)
        working-directory: backend
        run: npm run lint 2>/dev/null || echo "Lint warnings (non-blocking)"

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          retention-days: 3
          if-no-files-found: error
          path: |
            backend/dist/**
            backend/package.json
            backend/package-lock.json
            backend/tsconfig.json
            backend/src/**

  build-frontend-participants:
    name: Build Frontend (Participants)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Disable npm cache in this workflow because the runner sometimes fails to resolve
          # the lockfile path before the repository is fully checkouted or in monorepo cases.

      - name: Install participant frontend dependencies
        working-directory: frontend-participants
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Create build env
        working-directory: frontend-participants
        run: |
          cat > .env.prod <<'ENVEOF'
          ${{ secrets.FRONTEND_PARTICIPANTS_ENV }}
          ENVEOF

      - name: Clean build cache (participants)
        working-directory: frontend-participants
        run: rm -rf .next

      - name: Build participant frontend
        working-directory: frontend-participants
        run: npm run build

      - name: Upload participant artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-participants-build
          retention-days: 3
          if-no-files-found: error
          path: |
            frontend-participants/.next/**
            frontend-participants/package.json
            frontend-participants/package-lock.json
            frontend-participants/tsconfig.json
            frontend-participants/src/**
            frontend-participants/public/**
            frontend-participants/next.config.js

  build-frontend-manager:
    name: Build Frontend (Manager)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Disable npm cache in this workflow because the runner sometimes fails to resolve
          # the lockfile path before the repository is fully checkouted or in monorepo cases.

      - name: Install manager frontend dependencies
        working-directory: frontend-manager
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Create build env
        working-directory: frontend-manager
        run: |
          cat > .env.prod <<'ENVEOF'
          ${{ secrets.FRONTEND_MANAGER_ENV }}
          ENVEOF

      - name: Clean build cache (manager)
        working-directory: frontend-manager
        run: rm -rf .next

      - name: Build manager frontend
        working-directory: frontend-manager
        run: npm run build

      - name: Upload manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-manager-build
          retention-days: 3
          if-no-files-found: error
          path: |
            frontend-manager/.next/**
            frontend-manager/package.json
            frontend-manager/package-lock.json
            frontend-manager/tsconfig.json
            frontend-manager/src/**
            frontend-manager/public/**
            frontend-manager/next.config.js

  # ==========================================================
  # DEPLOY JOB
  # ==========================================================

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-backend, build-frontend-participants, build-frontend-manager]
    if: success()
    environment:
      name: production
      url: https://farmatour5.cuborojo.pe

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-deploy

      - name: Download participant artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-participants-build
          path: frontend-participants-deploy

      - name: Download manager artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-manager-build
          path: frontend-manager-deploy

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Configure SSH/SCP helpers
        run: |
          echo "SSH_OPTS=-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" >> "$GITHUB_ENV"

      - name: Verify server connectivity
        run: |
          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "echo 'SSH OK on host:' \\$(hostname); mkdir -p '$DEPLOY_BASE_PATH'/{backend,frontend-participants,frontend-manager,logs,backups}" < /dev/null

      - name: Backup production files
        run: |
          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_BASE_PATH="$DEPLOY_BASE_PATH" 'bash -s' <<'EOSSH'
          set -e
          cd "$DEPLOY_BASE_PATH"
          BACKUP_TIME=$(date +%Y%m%d_%H%M%S)
          mkdir -p backups
          for service in backend frontend-participants frontend-manager; do
            if [ -d "$service" ]; then
              tar -czf "backups/${service}_${BACKUP_TIME}.tar.gz" "$service" 2>/dev/null || true
              echo "Backed up $service"
            fi
          done
          ls -1t backups/*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          EOSSH

      - name: Deploy PM2 configuration
        run: |
          scp $SSH_OPTS ecosystem.config.js "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/"
          echo "PM2 configuration deployed"

      - name: Deploy Backend
        run: |
          if [ -d backend-deploy/backend ]; then BACKEND_SRC=backend-deploy/backend; else BACKEND_SRC=backend-deploy; fi
          tar -czf /tmp/backend-deploy.tar.gz -C "$BACKEND_SRC" .
          scp $SSH_OPTS /tmp/backend-deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/backend.tar.gz"
          rm -f /tmp/backend-deploy.tar.gz

          cat > /tmp/backend.env <<'ENVEOF'
          ${{ secrets.BACKEND_ENV }}
          ENVEOF
          scp $SSH_OPTS /tmp/backend.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/backend.env"
          rm -f /tmp/backend.env

          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_BASE_PATH="$DEPLOY_BASE_PATH" 'bash -s' <<'EOSSH'
          set -e
          export PATH="$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential python3 make g++ >/dev/null

          mkdir -p "$DEPLOY_BASE_PATH/backend"
          tar -xzf "$DEPLOY_BASE_PATH/backend.tar.gz" -C "$DEPLOY_BASE_PATH/backend"
          rm -f "$DEPLOY_BASE_PATH/backend.tar.gz"
          if [ -f "$DEPLOY_BASE_PATH/backend.env" ]; then
            cp "$DEPLOY_BASE_PATH/backend.env" "$DEPLOY_BASE_PATH/backend/.env"
            rm -f "$DEPLOY_BASE_PATH/backend.env"
          fi
          cd "$DEPLOY_BASE_PATH/backend"
          npm install --no-audit --no-fund
          npm run build
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          if pm2 describe farmatour5-backend >/dev/null 2>&1; then
            pm2 reload farmatour5-backend --update-env
          else
            pm2 start "$DEPLOY_BASE_PATH/ecosystem.config.js" --only farmatour5-backend
          fi
          pm2 save
          echo "Backend deployed"
          EOSSH

      - name: Deploy Frontend (Participants)
        run: |
          if [ -d frontend-participants-deploy/frontend-participants ]; then PARTICIPANTS_SRC=frontend-participants-deploy/frontend-participants; else PARTICIPANTS_SRC=frontend-participants-deploy; fi
          tar -czf /tmp/frontend-participants-deploy.tar.gz -C "$PARTICIPANTS_SRC" .
          scp $SSH_OPTS /tmp/frontend-participants-deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/frontend-participants.tar.gz"
          rm -f /tmp/frontend-participants-deploy.tar.gz

          cat > /tmp/participants.env <<'ENVEOF'
          ${{ secrets.FRONTEND_PARTICIPANTS_ENV }}
          ENVEOF
          scp $SSH_OPTS /tmp/participants.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/frontend-participants.env"
          rm -f /tmp/participants.env

          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_BASE_PATH="$DEPLOY_BASE_PATH" 'bash -s' <<'EOSSH'
          set -e
          export PATH="$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"
          mkdir -p "$DEPLOY_BASE_PATH/frontend-participants"
          tar -xzf "$DEPLOY_BASE_PATH/frontend-participants.tar.gz" -C "$DEPLOY_BASE_PATH/frontend-participants"
          rm -f "$DEPLOY_BASE_PATH/frontend-participants.tar.gz"
          if [ -f "$DEPLOY_BASE_PATH/frontend-participants.env" ]; then
            cp "$DEPLOY_BASE_PATH/frontend-participants.env" "$DEPLOY_BASE_PATH/frontend-participants/.env.prod"
            rm -f "$DEPLOY_BASE_PATH/frontend-participants.env"
          fi
          cd "$DEPLOY_BASE_PATH/frontend-participants"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          if pm2 describe farmatour5-participants >/dev/null 2>&1; then
            pm2 reload farmatour5-participants --update-env
          else
            pm2 start "$DEPLOY_BASE_PATH/ecosystem.config.js" --only farmatour5-participants
          fi
          pm2 save
          echo "Participants frontend deployed"
          EOSSH

      - name: Deploy Frontend (Manager)
        run: |
          if [ -d frontend-manager-deploy/frontend-manager ]; then MANAGER_SRC=frontend-manager-deploy/frontend-manager; else MANAGER_SRC=frontend-manager-deploy; fi
          tar -czf /tmp/frontend-manager-deploy.tar.gz -C "$MANAGER_SRC" .
          scp $SSH_OPTS /tmp/frontend-manager-deploy.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/frontend-manager.tar.gz"
          rm -f /tmp/frontend-manager-deploy.tar.gz

          cat > /tmp/manager.env <<'ENVEOF'
          ${{ secrets.FRONTEND_MANAGER_ENV }}
          ENVEOF
          scp $SSH_OPTS /tmp/manager.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_BASE_PATH/frontend-manager.env"
          rm -f /tmp/manager.env

          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_BASE_PATH="$DEPLOY_BASE_PATH" 'bash -s' <<'EOSSH'
          set -e
          export PATH="$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"
          mkdir -p "$DEPLOY_BASE_PATH/frontend-manager"
          tar -xzf "$DEPLOY_BASE_PATH/frontend-manager.tar.gz" -C "$DEPLOY_BASE_PATH/frontend-manager"
          rm -f "$DEPLOY_BASE_PATH/frontend-manager.tar.gz"
          if [ -f "$DEPLOY_BASE_PATH/frontend-manager.env" ]; then
            cp "$DEPLOY_BASE_PATH/frontend-manager.env" "$DEPLOY_BASE_PATH/frontend-manager/.env.prod"
            rm -f "$DEPLOY_BASE_PATH/frontend-manager.env"
          fi
          cd "$DEPLOY_BASE_PATH/frontend-manager"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2
          if pm2 describe farmatour5-manager >/dev/null 2>&1; then
            pm2 reload farmatour5-manager --update-env
          else
            pm2 start "$DEPLOY_BASE_PATH/ecosystem.config.js" --only farmatour5-manager
          fi
          pm2 save
          echo "Manager frontend deployed"
          EOSSH

      - name: Reload Nginx
        run: |
          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n nginx -t && sudo -n systemctl reload nginx && echo "Nginx reloaded"' < /dev/null

      - name: Health check
        run: |
          ssh -T $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_BASE_PATH="$DEPLOY_BASE_PATH" 'bash -s' <<'EOSSH'
          export PATH="$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"
          sleep 5
          curl -fsS https://farmatour5-api.cuborojo.pe/api/health || true
          curl -fsS https://farmatour5-admin.cuborojo.pe/ || true
          curl -fsS https://farmatour5.cuborojo.pe/ || true
          pm2 status || true
          EOSSH

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment successful - commit ${{ github.sha }}"
          else
            echo "Deployment failed - check logs above"
          fi
