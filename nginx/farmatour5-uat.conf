# ══════════════════════════════════════════════════════════════
# FARMATOUR5 - UAT NGINX CONFIGURATION WITH SSL/TLS
# ══════════════════════════════════════════════════════════════
# Location: /etc/nginx/sites-available/farmatour5-uat.conf
# 
# OBTENER CERTIFICADOS:
# sudo apt-get install -y certbot python3-certbot-nginx
# sudo certbot certonly --nginx -d farmatour5-api.cuborojo.pe \
#                                -d farmatour5-admin.cuborojo.pe \
#                                -d farmatour5.cuborojo.pe
# ══════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════
# BACKEND API - farmatour5-api.cuborojo.pe
# ══════════════════════════════════════════════════════════════

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name farmatour5-api.cuborojo.pe;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Backend API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farmatour5-api.cuborojo.pe;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/farmatour5-api.cuborojo.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmatour5-api.cuborojo.pe/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

