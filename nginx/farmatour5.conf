# Nginx configuration for Farmatour5
# Full production-ready setup with SSL, compression, and security headers

# Upstream services
upstream backend {
    server localhost:3001 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream participants_app {
    server localhost:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream manager_app {
    server localhost:3002 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name farmatour5.com www.farmatour5.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farmatour5.com www.farmatour5.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/farmatour5.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmatour5.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/farmatour5.com/chain.pem;

    # SSL Configuration (Modern + High Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # Logging
    access_log /var/www/farmatour5/logs/nginx-access.log combined buffer=32k flush=5s;
    error_log /var/www/farmatour5/logs/nginx-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # Performance
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # === ROUTING ===

    # API Backend
    location /api/ {
        limit_req zone=general burst=20 nodelay;
        
        # Special rate limit for login endpoints
        location /api/auth/admin/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include proxy_headers.conf;
        }

        location /api/auth/participant/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include proxy_headers.conf;
        }

        # Upload endpoint
        location /api/media/upload {
            limit_req zone=upload burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            include proxy_headers.conf;
        }

        # Default API proxy
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include proxy_headers.conf;

        # Cache control for API
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manager System (admin panel)
    location /manager-system/ {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://manager_app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        include proxy_headers.conf;

        # NextJS specific headers
        proxy_cache_bypass $http_upgrade;
        
        # Cache control
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    }

    # Participant App (default)
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://participants_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        include proxy_headers.conf;

        # NextJS specific headers
        proxy_cache_bypass $http_upgrade;

        # Cache only public assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://participants_app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Static uploads
    location /uploads/ {
        alias /var/www/farmatour5/uploads/;
        
        # Security: Prevent execution
        location ~ \.php$ {
            deny all;
        }

        # Cache long-lived
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        # Logs optional for uploads
        access_log /var/www/farmatour5/logs/nginx-uploads.log combined buffer=32k flush=5s;
    }

    # Swagger docs
    location /api/docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        include proxy_headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~ /\.env {
        deny all;
        access_log off;
    }

    location ~ /\.git {
        deny all;
        access_log off;
    }

    location ~ /node_modules {
        deny all;
        access_log off;
    }

    # Favicon & robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}

# HTTPS redirect for www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.farmatour5.com;

    ssl_certificate /etc/letsencrypt/live/farmatour5.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farmatour5.com/privkey.pem;

    return 301 https://farmatour5.com$request_uri;
}
